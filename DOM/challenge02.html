<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Challenge 2</title>
</head>
<body>
    <h1 id="title">Welcome Ghofran</h1>
    <p id="message">This is a paragraph.</p>

        console.log(title);
        console.log(message);
    </script>
