<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Challenge 4</title>
</head>
<body>
    <h2 class="item">HTML</h2>
    <h2 class="item">CSS</h2>
    <h2 class="item">JavaScript</h2>
    <h2 class="item">React</h2>
    <script>
        let item = document.querySelectorAll(".item");
        for (let i=0; i<item.length; i++) {
            let content = item[i].textContent;
            item[i].textContent = `Learning: ${content}`;
        }
        console.log(item);
    </script>
</body>
</html>
