<body>
    <script>
        let numbers = [15, 42, 7, 89, 23, 56];
        function findMax(numbers) {
            let max = numbers[0];
            for (let i=0; i<numbers.length; i++) {
                if (numbers[i] > max) {
                    max = numbers[i];
                }
            }
            return max;
        }
        console.log(`Maximum: ${findMax(numbers)}`);
    </script>
</body>
