<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge 52</title>
</head>
<body>
    <script>
        let students = [
            { name: "Ghofran", grade: 85 },
            { name: "Ahmed", grade: 72 },
            { name: "Mariam", grade: 91 },
            { name: "Omar", grade: 60 },
            { name: "Salma", grade: 88 }
        ];
        function findTopStudent(students) {
            let topStudent = students[0];
            for (let i=0; i<students.length; i++) {
                if (students[i].grade > topStudent.grade) {
                    topStudent = students[i];
                }
            }
            return topStudent;
        }
        let topStudent = findTopStudent(students);
        console.log(`Top Student: ${topStudent.name}`);
        console.log(`Grade: ${topStudent.grade}`);
    </script>
</body>
</html>
