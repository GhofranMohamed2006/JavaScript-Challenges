<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge 62</title>
</head>
<body>
    <script>
        let students = [
            { name: "Ghofran", grade: 85 },
            { name: "Ahmed", grade: 72 },
            { name: "Mariam", grade: 91 },
            { name: "Omar", grade: 60 },
            { name: "Salma", grade: 88 }
        ];
        function deleteStudent(students, searchName) {
            for (let i=0; i<students.length; i++) {
                if (students[i].name === searchName) {
                    let deletedStudent = students[i];
                    students.splice(i, 1);
                    return deletedStudent;
                }
            }
            return null;
        }
        let deletedStudent = deleteStudent(students, "Ahmed");
        console.log(deletedStudent);
    </script>
</body>
</html>
