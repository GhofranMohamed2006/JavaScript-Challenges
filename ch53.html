<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge 53</title>
</head>
<body>
    <script>
        let students = [
            { name: "Ghofran", grade: 85 },
            { name: "Ahmed", grade: 72 },
            { name: "Mariam", grade: 91 },
            { name: "Omar", grade: 60 },
            { name: "Salma", grade: 88 }
        ];
        function countPassedStudents(students) {
            let pass = 0;
            for(let i=0; i<students.length; i++) {
                if(students[i].grade >= 60) {
                    pass ++;
                }
            }
            return pass;
        }
        console.log(`Passed Students: ${countPassedStudents(students)}`);
    </script>
</body>
</html>
