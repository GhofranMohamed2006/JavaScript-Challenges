<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge 50</title>
</head>
<body>
    <script>
        let students = [
            ["Ghofran", 85],
            ["Ahmed", 72],
            ["Mariam", 91],
            ["Omar", 60],
            ["Salma", 88]
        ];
        function findStudent(students, searchName) {
            for (let i=0; i<students.length; i++) {
                if (students[i][0] === searchName) {
                    return students[i][1];
                }
            }
            return null;
        }
        let result = findStudent(students, "Mariam");
        if (result !== null) {
            console.log(`Grade: ${result}`);
        } else {
            console.log("Student Not Found");
        }
    </script>
</body>
</html>
