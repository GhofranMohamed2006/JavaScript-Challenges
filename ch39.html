<body>
    <script>
        let numbers = [15, 42, 7, 89, 23, 56];
        let min = numbers[0];
        for (let i=0; i<numbers.length; i++) {
            if (numbers[i] < min) {
                min = numbers[i];
            }
        }
        console.log(`Minimum: ${min}`);
    </script>
