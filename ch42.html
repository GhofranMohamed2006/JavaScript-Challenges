<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge 42</title>
</head>
<body>
    <script>
        let students = [
            ["Ghofran", 85],
            ["Ahmed", 72],
            ["Mariam", 91],
            ["Omar", 60],
            ["Salma", 88]
        ];
        let searchName = "Mariam";
        let found = false;
        for (let i=0; i<students.length; i++) {
            if (students[i][0] === searchName) {
                console.log(`Student Found: ${students[i][0]} \n Grade: ${students[i][1]}`);
                found = true;
                break;
            }
        }
        if (!found) {
            console.log("Student Not Found");
        }
    </script>
</body>
</html>
