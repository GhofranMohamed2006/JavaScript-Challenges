<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge 54</title>
</head>
<body>
    <script>
        let students = [
            { name: "Ghofran", grade: 85 },
            { name: "Ahmed", grade: 72 },
            { name: "Mariam", grade: 91 },
            { name: "Omar", grade: 60 },
            { name: "Salma", grade: 88 }
        ];
        function getPassedStudents(students) {
            let passedStudents = [];
            for (let i=0; i<students.length; i++) {
                if (students[i].grade >= 60) {
                    passedStudents.push(students[i]);
                }
            }
            return passedStudents;
        }
        let passedStudents = getPassedStudents(students);
        console.log(passedStudents);
    </script>
</body>
</html>
