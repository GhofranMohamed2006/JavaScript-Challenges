<body>
    <script>
        let numbers = [10, 15, 20, 25, 30, 35, 40];
        let count = 0;
        for (let i=0; i<numbers.length; i++) {
            if (numbers[i] > 20) {
                count ++;
            }
        }
        console.log(`Count: ${count}`);
    </script>
