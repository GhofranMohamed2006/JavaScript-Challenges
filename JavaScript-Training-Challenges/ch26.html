<body>
    <script>
        let fruits = ["Apple", "Banana", "Orange"];
        fruits.unshift("Mango");
        console.log(fruits);
        fruits.push("Strawberry");
        console.log(fruits);
        fruits.shift();
        console.log(fruits);
        fruits.pop();
        console.log(fruits);
    </script>
</body>
