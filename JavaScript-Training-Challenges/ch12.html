<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge 12</title>
</head>
<body>
    <script>
        var username = "Ghofran Mohamed";
        console.log(`Length: ${username.length}`);
        console.log(`Uppercase: ${username.toLocaleUpperCase()}`);
        console.log(`Lowercase: ${username.toLowerCase()}`);
        console.log(`First Character: ${username[0]}`);
        console.log(`Last Character: ${username[username.length - 1]}`);
    </script>
</body>
</html>
