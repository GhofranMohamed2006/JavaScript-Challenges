<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge 60</title>
</head>
<body>
    <script>
        let students = [
            { name: "Ghofran", grade: 85 },
            { name: "Ahmed", grade: 72 },
            { name: "Mariam", grade: 91 },
            { name: "Omar", grade: 60 },
            { name: "Salma", grade: 88 }
        ];
        function updateStudentGrade(students, searchName, newGrade) {
            for (let i=0; i<students.length; i++) {
                if (students[i].name === searchName) {
                    students[i].grade = newGrade;
                    return students[i];
                }
            }
            return null;
        }
        let result = updateStudentGrade(students, "Ahmed", 95);
        console.log(result);
    </script>
</body>
</html>
