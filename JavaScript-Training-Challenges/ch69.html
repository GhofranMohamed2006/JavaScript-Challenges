<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge 69</title>
</head>
<body>
    <script>
        let students = [
            { name: "Ghofran", grade: 85 },
            { name: "Ahmed", grade: 72 },
            { name: "Mariam", grade: 91 },
            { name: "Omar", grade: 55 },
            { name: "Salma", grade: 88 }
        ];
        function getFailedStudents(students) {
            let failedStudents = [];
            for (let i=0; i<students.length; i++) {
                if (students[i].grade < 60) {
                    failedStudents.push(students[i]);
                }
            }
            return failedStudents;
        }
        let failed = getFailedStudents(students);
        console.log(failed);
    </script>
</body>
</html>
