<!DOCTYPE html>

    <title>Challenge 48</title>
</head>
<body>
    <script>
        let numbers = [10, 20, 30, 40, 50]; 
        function calculateSum(numbers) {
            let total = 0;
            for (let i=0; i<numbers.length; i++) {
                total += numbers[i];
            }
            return total;
        }
        console.log(`Total: ${calculateSum(numbers)}`);
    </script>
</body>
