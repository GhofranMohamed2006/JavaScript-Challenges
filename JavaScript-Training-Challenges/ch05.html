<body>
    <script>
        var grade = 85;
        if (grade >= 90) {
            console.log("Excellent");
        }
        else if (grade >= 80) {
            console.log("Very Good");
        }
        else if (grade >= 70) {
            console.log("Good");
        }
        else if (grade >= 60) {
            console.log("Pass");
        }
        else {
            console.log("Fail");
        }
    </script>
