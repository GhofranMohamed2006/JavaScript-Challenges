<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge 65</title>
</head>
<body>
    <script>
        let students = [
            { name: "Ghofran", grade: 85 },
            { name: "Ahmed", grade: 72 },
            { name: "Mariam", grade: 91 },
            { name: "Omar", grade: 60 },
            { name: "Salma", grade: 88 }
        ];
        function addStudent(students, name, grade) {
            for (let i=0; i<students.length; i++) {
                if (students[i].name === name) {
                    return "Student Already Exists";
                }
            }
            let newStudent = {
                name,
                grade
            };
            students.push(newStudent);
            return newStudent;
        }
        let result1 = addStudent(students, "Ghofran", 90);
        let result2 = addStudent(students, "Khaled", 78);
        console.log(result1);
        console.log(result2);
    </script>
</body>
</html>
